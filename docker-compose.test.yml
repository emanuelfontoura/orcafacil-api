services:
  api_test:
    build: 
      context: .
      dockerfile: Dockerfile.test
    container_name: orcafacil-api-test
    env_file:
      - .env.test
    depends_on:
      postgres_test:
        condition: service_healthy
      redis_test:
        condition: service_started
    volumes:
      - .:/app
      - /app/node_modules
    command: tail -f /dev/null

  postgres_test:
    image: postgres:15
    container_name: orcafacil-postgres-test
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis_test:
    image: redis:7
    container_name: orcafacil-redis-test
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10