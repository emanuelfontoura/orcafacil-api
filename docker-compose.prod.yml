services:
  api:
    image: 
    container_name: orcafacil-api
    
    restart: unless-stopepd

    env_file:
      - .env.prod

    ports:
      - "3000:3000"

    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:17
    container_name: orcafacil-postgres

    restart: unless-stopped

    env_file:
      - .env.prod

    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    container_name: orcafacil-redis

    restart: unless-stopped

    volumes:
      - redis_data:/data

volumes:
  postgres-data: