name: CI

on:
  pull-request:
    branches: ["develop", "main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npm run lint
      - run: npx prisma generate
      - run: npm run test:unit:run
      - run: npm run test:e2e:run